name: Build SED Battle Survival Android APK

on:
  push:
    paths:
      - "BattleSurvival/**"
      - ".github/workflows/battle-survival-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Export Godot Android APK
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;23.2.8568313" "cmake;3.10.2.4988404"

      - name: Export Godot project for Android
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://downloads.tuxfamily.org/godotengine/4.3/Godot_v4.3-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://downloads.tuxfamily.org/godotengine/4.3/Godot_v4.3-stable_export_templates.tpz
          relative_project_path: BattleSurvival
          export_debug: true
          use_preset_export_path: true
          presets_to_export: Android
          verbose: true

      - name: Verify APK exists
        run: |
          test -s BattleSurvival/build/SED-Battle-Survival.apk
          ls -lh BattleSurvival/build/SED-Battle-Survival.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SED-Battle-Survival-Android
          path: BattleSurvival/build/SED-Battle-Survival.apk
          if-no-files-found: error
          retention-days: 14
